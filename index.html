<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Decay Series of Uranium-238</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Noto+Sans+Arabic:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<!-- Shared theme. If the theme repo can't be reached, the copy in this repo loads instead. -->
<link rel="stylesheet" href="https://gibsonm1.github.io/theme/theme-v1.css" onerror="this.onerror=null;this.href='theme-v1.css'">
<style>
:root{
  /* class color code: red/pink = positive (α, +2), blue = negative (β, −1); green stays for "correct" */
  --alpha-fill:#f9c6d3; --alpha-ink:#5c0f2b; --alpha-line:#c2185b;
  --beta-fill:#b9dcf7;  --beta-ink:#0b3a5c;  --beta-line:#1e6fb0;
  --bar-h:64px;
}
@media (prefers-color-scheme:dark){ :root{ --alpha-line:#f48fb1; --beta-line:#8ec9f2; } }
body{overflow-x:hidden}
html[lang="ar"] body{font-family:"Gibson Greek","Noto Sans Arabic",var(--md-ref-typeface)}
html[lang="zh-Hant"] body{font-family:"Gibson Greek","Atkinson Hyperlegible","Noto Sans TC",var(--md-ref-typeface)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;flex-wrap:wrap;row-gap:4px}
.topbar h1{font-size:18px}
.topbar .md-stepper button{padding:0 8px;gap:5px;min-height:34px}
.topbar .md-stepper .num{width:20px;height:20px}
.topbar{gap:12px}
.tb-prog{font:var(--md-sys-typescale-label-large);color:var(--md-sys-color-on-surface-variant);white-space:nowrap;padding:0 4px}
.tb-lang{display:flex;align-items:center;gap:6px;font:var(--md-sys-typescale-label-large);color:var(--md-sys-color-on-surface-variant)}
.tb-lang svg{width:20px;height:20px}
.tb-lang #langLbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tb-lang select{min-height:40px;padding:6px 8px}
main{padding:12px 16px 24px}

/* math always reads left to right, even in Arabic */
.nuc,.eq,.deq,.bigeq,.math,.mcard,.chart,.frameEn,.ltr{direction:ltr;unicode-bidi:isolate}
.nuc{display:inline-flex;align-items:center;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.nuc .pre{display:inline-flex;flex-direction:column;align-items:flex-end;font-size:.56em;font-weight:700;margin-right:.08em;gap:.14em}
.nuc .sym{font-weight:700}
.kw{font-weight:700;white-space:nowrap}
.tr{font-weight:400;color:var(--md-sys-color-on-surface-variant);margin-inline-start:.3em}
.tr:lang(ar){font-family:"Gibson Greek","Noto Sans Arabic",var(--md-ref-typeface)}
.tr:lang(zh-Hant){font-family:"Gibson Greek","Noto Sans TC",var(--md-ref-typeface)}
.muted{color:var(--md-sys-color-on-surface-variant)}
h2{font:var(--md-sys-typescale-title-large);margin:0 0 8px}
h3{font:var(--md-sys-typescale-title-medium);margin:0 0 6px}
p{margin:0 0 10px}

/* start */
.start{max-width:780px;margin:24px auto;padding:32px}
.start h2{font:var(--md-sys-typescale-display-small);margin-bottom:12px}
.hero{display:flex;align-items:center;gap:16px;margin:8px 0 24px;direction:ltr}
.hero .span{flex:1;min-width:120px;display:flex;align-items:center;gap:8px;color:var(--md-sys-color-on-surface-variant);font:var(--md-sys-typescale-label-large);white-space:nowrap}
.hero .span::before,.hero .span::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--md-sys-color-outline) 0 6px,transparent 6px 12px)}
.start-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:16px 0 8px}
.err{color:var(--md-sys-color-error);min-height:1.5em;margin:4px 0}
.start-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.ver{font-size:12px;color:var(--md-sys-color-on-surface-variant);margin-top:16px}

/* cards */
.iso-card{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:none;
  width:96px;height:80px;padding:4px;border-radius:var(--md-sys-shape-corner-medium);
  border:2px solid var(--md-sys-color-outline);background:var(--md-sys-color-surface-container-lowest);
  color:var(--md-sys-color-on-surface);user-select:none;direction:ltr}
button.iso-card{cursor:grab;touch-action:none}
button.iso-card:hover{border-color:var(--md-sys-color-primary)}
.iso-card .nuc{font-size:30px}
.iso-card .nm{font-size:13px;line-height:1.1;color:var(--md-sys-color-on-surface-variant)}
.pcard{position:relative;display:inline-block;flex:none;width:78px;height:106px;border:0;padding:0;background:transparent;user-select:none;color:inherit}
button.pcard{cursor:grab;touch-action:none}
.pcard svg.shape{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pcard.a svg polygon{fill:var(--alpha-fill);stroke:var(--alpha-ink);stroke-width:2.5}
.pcard.b svg polygon{fill:var(--beta-fill);stroke:var(--beta-ink);stroke-width:2.5}
.pcard .gk{position:absolute;left:0;right:0;text-align:center;font-weight:700;font-size:21px;line-height:1}
.pcard .nuc{position:absolute;left:0;right:0;justify-content:center;font-size:28px}
.pcard.a{color:var(--alpha-ink)} .pcard.b{color:var(--beta-ink)}
.pcard.a .nuc{top:28px} .pcard.a .gk{top:71px;font-size:19px}
.pcard.b .nuc{top:28px} .pcard.b .gk{top:71px;font-size:19px}
[data-card][aria-pressed="true"]{outline:4px solid var(--md-sys-color-on-surface);outline-offset:3px}
.ghost{position:fixed;left:0;top:0;z-index:3000;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.3);border-radius:12px}
.pcard.ghost{box-shadow:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.dragsrc{opacity:.35}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}

/* layout helpers */
.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start;max-width:1320px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:16px}
.narrow{max-width:1000px;margin:0 auto}
.reading{font:var(--md-sys-typescale-body-reading)}
html[lang="ar"] .reading{font-family:"Gibson Greek","Noto Sans Arabic",var(--md-ref-typeface)}
.reading p{margin-bottom:12px}
.vid{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--md-sys-color-outline-variant)}
.vid:first-of-type{border-top:0}
.vid .md-btn{flex:none}
.headrow{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.speak{display:flex;align-items:center;gap:4px}
.speak select{min-height:40px;padding:4px 6px}
.bigeq{display:flex;align-items:center;gap:12px;font-size:34px;flex-wrap:wrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.legend .item{display:flex;align-items:center;gap:8px}
.legend .pcard{transform:scale(.8);margin:-10px -6px}
.q{border:1px solid var(--md-sys-color-outline-variant);border-radius:var(--md-sys-shape-corner-medium);padding:12px 14px;margin:0 0 12px;background:var(--md-sys-color-surface-container-lowest);min-width:0}
.q > legend{font:var(--md-sys-typescale-title-medium);padding:0 4px}
.qtext{margin:4px 0 8px}
.opt{display:flex;gap:10px;align-items:center;min-height:48px;padding:6px 10px;border:1px solid var(--md-sys-color-outline-variant);border-radius:var(--md-sys-shape-corner-small);margin:6px 0;cursor:pointer}
.opt:hover{border-color:var(--md-sys-color-outline)}
.opt input{width:20px;height:20px;flex:none;accent-color:var(--md-sys-color-primary)}
.opt .nuc{font-size:24px}
.fb{margin:8px 0 0;padding:8px 10px;border-radius:var(--md-sys-shape-corner-small);border-inline-start:4px solid}
.fb.ok{background:var(--app-color-success-container);color:var(--app-color-on-success-container);border-color:var(--app-color-success)}
.fb.bad{background:var(--md-sys-color-error-container);color:var(--md-sys-color-on-error-container);border-color:var(--md-sys-color-error)}
.fb.info{background:var(--md-sys-color-tertiary-container);color:var(--md-sys-color-on-tertiary-container);border-color:var(--md-sys-color-tertiary)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

/* equations, tally */
.eq{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.eq .op{font-size:30px;font-weight:700;color:var(--md-sys-color-on-surface-variant)}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px}
.cell .lbl{font-size:13px;color:var(--md-sys-color-on-surface-variant);text-align:center;max-width:150px;line-height:1.25}
.parent .iso-card{border:3px solid var(--md-sys-color-on-surface)}
.tally{margin-top:10px;display:grid;gap:6px}
.tline{display:grid;grid-template-columns:minmax(150px,auto) 1fr auto;gap:10px;align-items:center;padding:6px 10px;border-radius:var(--md-sys-shape-corner-small);font-variant-numeric:tabular-nums}
.tline.ok{background:var(--app-color-success-container);color:var(--app-color-on-success-container)}
.tline.bad{background:var(--md-sys-color-error-container);color:var(--md-sys-color-on-error-container)}
.tline .math{font-size:20px;font-weight:700}
.tline .st{font:var(--md-sys-typescale-label-large)}

/* build */
.build{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.06fr);gap:16px;height:calc(100dvh - var(--bar-h) - 24px);max-width:1400px;margin:0 auto}
.leftcol{display:flex;flex-direction:column;gap:12px;min-height:0}
.chainside{display:flex;flex-direction:column;min-height:0;flex:1}
.chainside h2{font:var(--md-sys-typescale-title-medium);margin-bottom:4px}
.chain-list{flex:1;min-height:0;overflow-y:auto;padding:2px 2px 8px}
.drows{list-style:none;margin:0;padding:0}
.drow{display:flex;align-items:center;gap:10px;padding:9px 4px;flex-wrap:nowrap}
.drow .dn{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:var(--md-sys-typescale-label-medium);background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)}
.deq{display:flex;align-items:center;gap:6px;font-size:20px;flex:none}
.deq .op{font-size:16px;color:var(--md-sys-color-on-surface-variant)}
.mshape{width:14px;height:19px;flex:none;vertical-align:middle}
.mshape.a polygon{fill:var(--alpha-fill);stroke:var(--alpha-ink);stroke-width:6}
.mshape.b polygon{fill:var(--beta-fill);stroke:var(--beta-ink);stroke-width:6}
.dhl{flex:1;min-width:0;font-size:13px;line-height:1.25;text-align:end;color:var(--md-sys-color-on-surface-variant)}
.dnote{flex-basis:100%;font-size:13px;color:var(--md-sys-color-on-surface-variant);padding-inline-start:36px}
.tag{font:var(--md-sys-typescale-label-medium);padding:2px 8px;border-radius:999px;background:var(--md-sys-color-tertiary-container);color:var(--md-sys-color-on-tertiary-container)}
.empty-chain{color:var(--md-sys-color-on-surface-variant);padding:8px 4px}
.work{overflow-y:auto;border:2px solid var(--md-sys-color-primary);background:var(--md-sys-color-surface-container-lowest)}
.work h2{margin-bottom:4px}
.slotwrap{position:relative}
.slot{position:relative;display:grid;place-items:center;padding:0;background:transparent;border:2px dashed var(--md-sys-color-outline);color:var(--md-sys-color-on-surface-variant);cursor:pointer}
.slot.p{width:96px;height:116px;border-radius:var(--md-sys-shape-corner-large)}
.slot.d{width:112px;height:92px;border-radius:var(--md-sys-shape-corner-medium)}
.slot .ph{font-size:13px;line-height:1.2;text-align:center;padding:6px}
.slot.ready{border-color:var(--md-sys-color-on-surface);border-width:3px;background:var(--md-sys-color-surface-container-high)}
.slot.over{border-style:solid;border-width:3px;border-color:var(--md-sys-color-on-surface);background:var(--md-sys-color-surface-container-highest);box-shadow:0 0 0 4px color-mix(in srgb,var(--md-sys-color-on-surface) 25%,transparent)}
.slot.filled{border-style:solid;border-color:transparent;cursor:default}
.rm{position:absolute;top:-10px;inset-inline-end:-10px;width:30px;height:30px;border-radius:50%;border:2px solid var(--md-sys-color-on-surface);background:var(--md-sys-color-surface-container-lowest);color:var(--md-sys-color-on-surface);display:grid;place-items:center;font-size:18px;line-height:1;padding:0;cursor:pointer;z-index:2}
.rm::after{content:"";position:absolute;inset:-9px}
.rm:hover{background:var(--md-sys-color-error);color:var(--md-sys-color-on-error);border-color:var(--md-sys-color-error)}
.tray{display:flex;gap:12px 16px;flex-wrap:wrap;padding:12px 16px;flex:none;background:var(--md-sys-color-surface-container-low)}
.tray > div:first-child{flex:none;max-width:176px}
.tray > div:last-child{flex:1;min-width:0}
.tray h3{margin:0}
.tray .sub{font-size:14px;color:var(--md-sys-color-on-surface-variant);margin:2px 0 8px;max-width:440px}
.piles,.isorow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;direction:ltr}
.remain{margin:12px 0 0;color:var(--md-sys-color-on-surface-variant)}
.donebox{margin:12px 0;padding:16px;border-radius:var(--md-sys-shape-corner-large);background:var(--app-color-success-container);color:var(--app-color-on-success-container)}
.placebar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));z-index:900;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-radius:var(--md-sys-shape-corner-large);background:var(--md-sys-color-inverse-surface);color:var(--md-sys-color-inverse-on-surface);box-shadow:0 4px 12px rgba(0,0,0,.3);max-width:calc(100vw - 24px)}
.placebar .md-btn{color:var(--md-sys-color-inverse-primary)}

/* sentence frame */
.sentence{margin-top:14px;padding:12px 14px;border-radius:var(--md-sys-shape-corner-medium);background:var(--md-sys-color-surface-container-low);border:1px solid var(--md-sys-color-outline-variant)}
.frameEn{font-size:19px;line-height:2.5;margin:4px 0;text-align:left}
.frameEn input{min-height:44px;font-size:18px;font-weight:700;padding:4px 8px;margin:0 2px}
.frameEn input.t{width:110px} .frameEn input.d{width:200px}
.gloss{font-size:15px}
.said{margin:12px 0 0;padding:8px 10px;border-radius:var(--md-sys-shape-corner-small);background:var(--app-color-success-container);color:var(--app-color-on-success-container)}

/* missing card */
.mcard{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:8px;border:2px dashed var(--md-sys-color-on-surface-variant);border-radius:var(--md-sys-shape-corner-medium);background:var(--md-sys-color-surface-container-lowest)}
.mcard .pre{display:flex;flex-direction:column;gap:4px}
.mcard input{width:84px;min-height:48px;text-align:center;font-size:20px;font-weight:700;padding:4px}
.mcard input.s{width:76px;min-height:100px;font-size:34px}
.fillrow{padding:14px 16px;margin:12px 0;border-radius:var(--md-sys-shape-corner-large);border:1px solid var(--md-sys-color-outline-variant);background:var(--md-sys-color-surface-container-lowest)}
.fillrow.active{border:2px solid var(--md-sys-color-primary)}
.ptype{display:flex;align-items:center;gap:8px;color:var(--md-sys-color-on-surface-variant);margin-bottom:10px}
.ptstrip{display:flex;gap:4px;overflow-x:auto;padding:4px 0 8px;margin:8px 0 4px;direction:ltr}
.pt{flex:none;width:68px;border:1px solid var(--md-sys-color-outline);border-radius:6px;text-align:center;padding:4px 2px;background:var(--md-sys-color-surface-container-lowest)}
.pt b{display:block;font-size:22px}
.pt small{display:block;font-size:12px;line-height:1.1}
.pt .z{font-size:12px;color:var(--md-sys-color-on-surface-variant)}

/* patterns */
.chartcard{position:sticky;top:calc(var(--bar-h) + 12px)}
.chart{width:100%;height:auto;display:block;font-family:var(--md-ref-typeface)}
.chart .grid line{stroke:var(--md-sys-color-outline-variant);stroke-width:1}
.chart .ax text{fill:var(--md-sys-color-on-surface-variant);font-size:13px}
.chart .ax .sym{font-weight:700;fill:var(--md-sys-color-on-surface)}
.chart .axt{fill:var(--md-sys-color-on-surface);font-size:14px;font-weight:700}
.chart .seg{fill:none;stroke-width:3.5;stroke-linecap:round}
.chart .seg.a{stroke:var(--alpha-line)} .chart .seg.b{stroke:var(--beta-line)}
.chart .ah.a{fill:var(--alpha-line)} .chart .ah.b{fill:var(--beta-line)}
.chart .mk.a{fill:var(--alpha-fill);stroke:var(--alpha-ink);stroke-width:1.5}
.chart .mk.b{fill:var(--beta-fill);stroke:var(--beta-ink);stroke-width:1.5}
.chart .node circle{fill:var(--md-sys-color-surface-container-lowest);stroke:var(--md-sys-color-on-surface);stroke-width:2}
.chart .node.end circle{fill:var(--md-sys-color-surface-container-highest);stroke:var(--md-sys-color-on-surface);stroke-width:3.5}
.chart .node text{font-size:11px;font-weight:700;fill:var(--md-sys-color-on-surface);text-anchor:middle;dominant-baseline:central}
.chart.anim .seg{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .35s ease-out forwards}
.chart.anim .ah,.chart.anim .mk,.chart.anim .node{opacity:0;animation:pop .25s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{opacity:1}}
.frame{font-size:18px;line-height:2.3}
.frame select{min-height:44px;margin:0 4px;font-size:16px}
.numin{width:100px}

/* send & help */
.summary{white-space:pre-wrap;background:var(--md-sys-color-surface-container-lowest);border:1px solid var(--md-sys-color-outline-variant);border-radius:var(--md-sys-shape-corner-small);padding:12px;max-height:50vh;overflow:auto;direction:ltr;text-align:left}
.gloss-table{border-collapse:collapse;width:100%;font-size:15px}
.gloss-table th,.gloss-table td{text-align:start;padding:6px 8px;border-bottom:1px solid var(--md-sys-color-outline-variant);vertical-align:top}

@media (min-width:1001px){ .placebar{left:24px;transform:none} html[dir="rtl"] .placebar{left:auto;right:24px} }
@media (max-width:1000px), (max-height:520px){
  .two{grid-template-columns:1fr}
  .chartcard{position:static}
  .topbar h1{font-size:17px}
  /* building the chain: history on top, then the equation, then the cards in a dock pinned to the bottom of the screen */
  .build{display:flex;flex-direction:column;gap:12px;height:auto}
  .leftcol{display:contents}
  .chainside{order:1}
  .chain-list{max-height:30vh;overflow-y:auto}
  .work{order:2}
  .tray,.elems{order:3;position:sticky;bottom:0;z-index:20;box-shadow:0 -4px 16px rgba(0,0,0,.2)}
}
@media (prefers-reduced-motion:reduce){ .chart.anim .seg{stroke-dashoffset:0} .chart.anim .ah,.chart.anim .mk,.chart.anim .node{opacity:1} }

.eqrow{display:flex;gap:16px 20px;align-items:flex-start;flex-wrap:wrap}
.eqrow .side{flex:1;min-width:250px;display:flex;flex-direction:column;gap:8px}
.side .tline{grid-template-columns:1fr auto;grid-template-areas:"n s" "m m";gap:0 8px;padding:5px 10px}
.side .tline .tn{grid-area:n;font-size:14px}.side .tline .st{grid-area:s;font-size:13px}.side .tline .math{grid-area:m;font-size:19px}
@media (min-width:1001px){ .md-snackbar{left:24px;transform:translate(0,24px)} .md-snackbar.show{transform:none} html[dir="rtl"] .md-snackbar{left:auto;right:24px} }

.deq.locked{font-size:30px;gap:10px;margin:6px 0 10px}
.deq.locked .op{font-size:24px}
.deq.locked .mshape{width:20px;height:27px}
.tline.compact{grid-template-columns:auto auto 1fr;gap:24px}
.tline.compact .st{text-align:end}
.tline .math{white-space:nowrap}
.tline{grid-template-columns:minmax(120px,1fr) auto auto}
.cell .lbl{max-width:170px}
.slot .ph{font-size:24px;font-weight:700}
.slot.p .ph{font-size:15px}
.nw{white-space:nowrap}
.chart{max-height:calc(100dvh - var(--bar-h) - 140px)}

.elems{flex:none;padding:12px 16px;background:var(--md-sys-color-surface-container-low)}
.elems h3{margin-bottom:8px}
.elemgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;direction:ltr}
.elems .pt{width:auto;padding:4px}
.elems .pt small{font-size:14px}

/* update 7: Learn sections, worked-example markup, sentence helper text */
.q > legend.qtext{font:inherit;padding:0;margin:0 0 8px;float:left;width:100%}
.q > legend.qtext + *{clear:both}
.learn{display:flex;flex-direction:column;gap:12px}
.acc{padding:0;overflow:hidden}

.acc-h button:disabled{cursor:default;color:var(--md-sys-color-on-surface-variant)}

.acc-t{flex:1}

.acc-h button:disabled .chev{display:none}
.acc-b{padding:0 16px 16px}
.namenote{padding:8px 10px;border-radius:var(--md-sys-shape-corner-small);background:var(--md-sys-color-surface-container-high)}
.blank{display:inline-flex;flex-direction:column;vertical-align:top;margin:0 2px}
.blank .help{font-size:13px;line-height:1.25;color:var(--md-sys-color-on-surface-variant);padding:2px 4px 0}

/* update 8: worked-example animation */
.exeq{font-size:44px;margin:8px 0 6px}
.exeq .nuc .pre{gap:.32em}
.exn{position:relative;display:inline-block}
.exn.ring-on::after{content:"";position:absolute;inset:-4px -8px;border:3px solid var(--md-sys-color-tertiary);border-radius:999px;animation:ringIn .4s ease-out}

.exline{background:var(--md-sys-color-surface-container-high);color:var(--md-sys-color-on-surface);transition:background .3s}
.exline:not(.ok) .st{visibility:hidden}
.exd{display:inline-block;transition:opacity .2s}
.exd.hide{opacity:0}
.exd.land{animation:land .55s ease-out}
@keyframes land{0%{transform:scale(1.35);color:var(--md-sys-color-tertiary)}100%{transform:scale(1)}}
.exfly{position:fixed;z-index:2500;transform-origin:0 0;pointer-events:none;font-weight:700;color:var(--md-sys-color-tertiary);line-height:1}

/* update 9: equation grid with aligned balance rows; chain arrows; info button */
.eqgrid{display:grid;grid-template-columns:auto 36px auto 36px auto minmax(150px,1fr);align-items:center;justify-items:center;column-gap:8px;row-gap:5px;direction:ltr;margin:6px 0}
.eqgrid .et{display:flex;justify-content:center}

.eqgrid.exeq .et{font-size:44px} .eqgrid.exeq .nuc .pre{gap:.32em}

.pnuc{display:inline-flex;align-items:center;gap:6px}
.tbg{grid-column:1/-1;align-self:stretch;justify-self:stretch;border-radius:var(--md-sys-shape-corner-small);background:var(--md-sys-color-surface-container-high);transition:background .3s}
.tbg.ok{background:var(--app-color-success-container)} .tbg.bad{background:var(--md-sys-color-error-container)}

.tlab.pending .st{visibility:hidden}
.drows{position:relative}
svg.links{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
svg.links path{fill:none;stroke:var(--md-sys-color-outline);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.info::after{content:"";position:absolute;inset:-12px}

    <article class="md-card"><h2>${t("patH")}</h2>
      <div class="q"><p class="frame"><b>1)</b> ${t("p1", { s1: scaleSel("aA", "alpha: mass number"), s2: scaleSel("aZ", "alpha: atomic number") })}</p>${fb(it.alpha, t("p1ok"), t("p1bad"))}</div>
      <div class="q"><p class="frame"><b>2)</b> ${t("p2", { s1: scaleSel("bA", "beta: mass number"), s2: scaleSel("bZ", "beta: atomic number") })}</p>${fb(it.beta, t("p2ok"), t("p2bad"))}</div>
      <div class="q"><p><b>3)</b> ${t("p3")}</p><p class="muted">${t("p3start")}</p>
        <textarea class="md-textarea" data-pat="why" aria-label="${esc(t("ariaWhy"))}">${esc(p.why || "")}</textarea>${sh && !it.why ? `<p class="fb bad">${t("p3short")}</p>` : ""}</div>
      <div class="q"><p><b>4)</b> ${t("p4")}</p>
        <input class="md-input numin" type="number" inputmode="numeric" data-pat="he" aria-label="${esc(t("ariaNum"))}" value="${esc(p.he || "")}">
        ${sh ? (it.he ? `<p class="fb ok">${t("p4ok")}</p>` : `<p class="fb bad">✗ ${heMsg}</p>`) : ""}</div>
      ${mcBlock(PMC[0], state.pat, sh, 5)}${mcBlock(PMC[1], state.pat, sh, 6)}
      <div class="q"><p class="frame"><b>7)</b> ${t("p7", { s: `<select class="md-select" data-pat="more" aria-label="${esc(t("more"))} / ${esc(t("less"))}"><option value="">${t("chooseOpt")}</option><option value="more" ${p.more === "more" ? "selected" : ""}>${t("more")}</option><option value="less" ${p.more === "less" ? "selected" : ""}>${t("less")}</option></select>` })}</p>
        <textarea class="md-textarea" data-pat="hlwhy" aria-label="${esc(t("ariaWhy"))}">${esc(p.hlwhy || "")}</textarea>
        ${sh ? (it.more ? (it.hlwhy ? `<p class="fb ok">${t("p7ok")}</p>` : `<p class="fb bad">${t("p7finish")}</p>`) : `<p class="fb bad">${t("p7bad")}</p>`) : ""}</div>
      <div class="actions"><button class="md-btn ${allOk ? "outlined" : "filled"}" type="button" data-act="checkPat">${t("checkAnswers")}</button>${allOk ? nextBtn(4) : ""}</div>
    </article></div>`;
}
function checkPat() {
  state.patShown = true; const it = patItems(), p = state.pat, has = (k) => p[k] !== undefined && p[k] !== "";
  const answered = { alpha: has("aA") && has("aZ"), beta: has("bA") && has("bZ"), he: has("he"), stop: has("stop"), hl: has("hl"), more: has("more") };
  Object.keys(answered).forEach((k) => { if (answered[k] && state.patFirst[k] === undefined) state.patFirst[k] = it[k]; });
  if (Object.values(it).every(Boolean)) { unlock(4); beep("ok"); snack(t("unlocked", { s: t("st4") })); } else beep("no");
  save(); render();
}

/* ---------------- step 5: new chain (Am-241) ---------------- */
function renderAm(app) {
  const cur = state.am.findIndex((a) => !a.ok), done = cur < 0;
  app.innerHTML = `<div class="narrow"><article class="md-card"><h2>${t("amH")}</h2><p class="reading">${t("amP")}</p>${strip()}
    ${FILL.am.map((_, i) => (done || i <= cur ? fillRow("am", i, i === cur) : "")).join("")}
    ${done ? `<div class="donebox"><h3>${t("niceH")}</h3><p>${t("niceP")}</p>${nextBtn(5)}</div>` : ""}</article></div>`;
}

/* ---------------- step 6: send (the summary stays in English for the teacher) ---------------- */
function results() {
  const rows = state.rows.filter((r) => !r.example), mins = Math.max(1, Math.round(((state.finished || Date.now()) - state.started) / 60000));
  const traps = state.traps.map((x) => `decay ${x.decay}: ${x.card} (${x.why})`).join("; ") || "none";
  const mc1 = MC.filter((q) => state.mcFirst[q.id]).length, pf = ["alpha", "beta", "he", "stop", "hl", "more"].filter((k) => state.patFirst[k]).length;
  const allS = [...state.prac.map((x) => x.sent), ...rows.map((r) => r.sent)], sents = allS.filter((s) => s.ok), s1 = sents.filter((s) => s.first).length, shown = allS.filter((s) => s.shown).length;
  return `Quick check: ${mc1}/3 right on first try | Practice cards: ${state.prac.filter((x) => x.first).length}/2 right on first try | Chain: ${rows.length} decays, ${sum(rows, (r) => r.checks)} checks, ${sum(rows, (r) => r.wrong)} not balanced, ${sum(rows, (r) => r.hint)} hints | Trap cards placed: ${traps} | Sentences: ${sents.length} written, ${s1} right on first try, ${shown} answers shown after 3 misses | Patterns: ${pf}/6 right on first try | Am-241 cards: ${state.am.filter((a) => a.first).length}/3 right on first try | Language: ${L()} | Time: about ${mins} min`;
}
function written() {
  const p = state.pat, rows = state.rows.filter((r) => !r.example);
  const sent = [...state.prac.map((x, i) => ({ s: x.sent, key: `prac:${i}` })), ...rows.map((r) => ({ s: r.sent, key: `row:${state.rows.indexOf(r)}` }))]
    .filter((x) => x.s.said).map((x) => "- " + sentText(sentCtx(x.key))).join("\n");
  return `Why beta decay raises the atomic number: ${p.why || ""}\nHalf-life: An isotope with a half-life of 1 day is ${p.more || "___"} stable than one with a half-life of 1,000 years, because ${p.hlwhy || ""}\n\nSentences written and said:\n${sent}`;
}
function renderSend(app) {
  const res = results(), wr = written(), fullTxt = `Name: ${state.name}\nPeriod: ${state.period}\n${res}\n\n${wr}`;
  const hasForm = CONFIG.formPrefillUrl && CONFIG.formPrefillUrl.includes("STUDENTNAME");
  app.innerHTML = `<div class="narrow"><article class="md-card"><h2>${t("sendH", { name: esc(state.name) })}</h2><p>${t("sendP", { t: esc(CONFIG.teacherName) })}</p>
    <div class="summary" id="sum" lang="en">${esc(fullTxt)}</div>
    <div class="actions">${hasForm ? `<button class="md-btn filled" type="button" data-act="send">${t("sendBtn")}</button>` : ""}
      <button class="md-btn ${hasForm ? "outlined" : "filled"}" type="button" data-act="copy">${t("copyBtn")}</button>
      <button class="md-btn text" type="button" data-act="reset">${t("over")}</button></div>
    <p class="muted" style="margin-top:10px">${hasForm ? t("sendNoteForm") : t("sendNoteCopy")}</p></article></div>`;
}
function sendForm() {
  const enc = encodeURIComponent;
  window.open(CONFIG.formPrefillUrl.replace("STUDENTNAME", enc(state.name)).replace("CLASSPERIOD", enc(state.period)).replace("SCORES", enc(results())).replace("WRITTEN", enc(written())), "_blank", "noopener");
}
async function copyWork() {
  try { await navigator.clipboard.writeText($("#sum").textContent); snack(t("copied")); }
  catch (e) { const r = document.createRange(); r.selectNodeContents($("#sum")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); snack(t("highlighted")); }
}

/* ---------------- help ---------------- */
function openHelp() {
  const d = $("#helpDlg"), langs = [["es", "Español"], ["zh", "繁體中文"], ["ar", "العربية"]];
  d.innerHTML = `<h2 id="helpTitle">${t("helpH")}</h2><p>${t("helpMove")}</p><p>${t("helpTake")}</p><p>${t("helpCheck")}</p>
    <div class="legend" style="margin:8px 0 16px"><span class="item">${pCard("a", 'aria-hidden="true"', "div")}${t("legA")}</span><span class="item">${pCard("b", 'aria-hidden="true"', "div")}${t("legB")}</span></div>
    <h3>${t("kwH")}</h3><div style="overflow-x:auto"><table class="gloss-table"><thead><tr><th>English</th>${langs.map(([, n]) => `<th>${n}</th>`).join("")}</tr></thead><tbody>
    ${Object.entries(KW).map(([en, tr]) => `<tr><td lang="en">${esc(en)}</td>${langs.map(([k]) => `<td lang="${LANGTAG[k]}" dir="${k === "ar" ? "rtl" : "ltr"}">${esc(tr[k])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    <p class="ver">${t("version")}: ${VERSION}</p><div class="md-dialog-actions"><button class="md-btn filled" type="button" data-act="closeHelp">${t("close")}</button></div>`;
  d.showModal();
}

/* ---------------- events ---------------- */
function setLang(v) { state.lang = v; save(); if ("speechSynthesis" in window) speechSynthesis.cancel(); render(); }
$("#lang").addEventListener("change", (e) => setLang(e.target.value));
$("#snd").addEventListener("click", () => { soundOn = !soundOn; try { localStorage.setItem("decay238-sound", soundOn ? "1" : "0"); } catch (e) {} paintSound(); if (soundOn) beep("ok"); });
$("#helpBtn").addEventListener("click", openHelp);
document.addEventListener("click", (e) => {
  if (justDragged) return;
  const a = e.target.closest("[data-act]"), act = a?.dataset.act;
  if (act === "goto") return go(Number(a.dataset.step));
  if (act === "start") return startActivity();
  if (act === "reset") { if (confirm(t("confirmReset"))) { const l = state.lang; state = fresh(); state.lang = l; if (who) { state.name = whoName(); state.period = String(who.period || ""); } sel = null; save(); render(); } return; }
  if (act === "checkMC") return checkMC();
  if (act === "sec") { const i = +a.dataset.i; state.learnOpen = (state.learnOpen ?? 0) === i ? -1 : i; save(); render(); return $("#sec" + i)?.scrollIntoView({ block: "nearest" }); }
  if (act === "secNext") { const i = +a.dataset.i + 1; state.learnMax = Math.max(state.learnMax ?? 0, i); state.learnOpen = i; save(); render(); return $("#sec" + i)?.scrollIntoView({ block: "start", behavior: "smooth" }); }
  if (act === "checkFill") return checkFill(a.dataset.kind, +a.dataset.i);
  if (act === "checkSent") return checkSent(a.dataset.key);
  if (act === "hear") return say(sentText(sentCtx(a.dataset.key)), "en", null, "");
  if (act === "said") return saidIt(a.dataset.key);
  if (act === "checkRow") return checkRow();
  if (act === "hint") { const r = state.rows[curRow()]; r.hint = Math.min(3, r.hint + 1); save(); return render(); }
  if (act === "takeOut") return takeOut(a.dataset.slot);
  if (act === "checkPat") return checkPat();
  if (act === "replayEx") return playExample();
  if (act === "noteM") return snack(t("noteM"), 9000);
  if (act === "replay") { $("#chartBox").innerHTML = chartSVG(true); return; }
  if (act === "send") return sendForm();
  if (act === "copy") return copyWork();
  if (act === "speak") return speakEl(a.dataset.target, a);
  if (act === "closeHelp") return $("#helpDlg").close();
  if (act === "unselect") { sel = null; return paintSel(); }
  if (state.at !== 2 || !state.started) return;
  const card = e.target.closest("#tray [data-card]"); if (card) { const id = card.dataset.card; return place(id === "a" || id === "b" ? "p" : "d", id); }
  const slot = e.target.closest(".slot[role=button]"); if (slot && sel) return place(slot.dataset.slot, sel);
});
document.addEventListener("keydown", (e) => {
  const el = e.target;
  if (e.key === "Escape" && sel) { sel = null; paintSel(); }
  if ((e.key === "Enter" || e.key === " ") && el.matches?.(".slot[role=button]")) { e.preventDefault(); if (sel) place(el.dataset.slot, sel); else snack(t("chooseFirst")); }
  if (e.key === "Enter" && (el.id === "nm" || el.id === "pd")) startActivity();
  if (e.key === "Enter" && el.dataset?.fill) { e.preventDefault(); checkFill(el.dataset.fill, +el.dataset.i); }
  if (e.key === "Enter" && el.dataset?.sent) { e.preventDefault(); checkSent(el.dataset.sent); }
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.store === "mc") { state.mc[el.name] = Number(el.value); save(); }
  else if (el.dataset.store === "pat") { state.pat[el.name] = Number(el.value); save(); }
  else if (el.dataset.pat) { state.pat[el.dataset.pat] = el.value; save(); }
});
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.dataset.pat) { state.pat[el.dataset.pat] = el.value; save(); }
  if (el.dataset.fill) { state[el.dataset.fill][+el.dataset.i][el.dataset.f] = el.value; save(); }
  if (el.dataset.sent) { const c = sentCtx(el.dataset.sent); c.s[el.dataset.f] = el.value; save(); }
});
window.addEventListener("resize", () => { document.documentElement.style.setProperty("--bar-h", $("#bar").offsetHeight + "px"); fitGrids(); if (state.at === 2) drawLinks(); });
NARROW.addEventListener("change", () => render());
document.fonts?.ready.then(() => { if (state.at === 2) drawLinks(); });

/* self-checks (console only): every decay has exactly one balancing card; the chain itself balances */
CHAIN.slice(0, -1).forEach((par, i) => {
  const ty = DECAYS[i]; console.assert(par.A === P[ty].A + CHAIN[i + 1].A && par.Z === P[ty].Z + CHAIN[i + 1].Z, "Bad chain at", par.id);
  const { cards } = makeCards(i); console.assert(cards.filter((id) => balances(par, C(id))).length === 1, "Ambiguous cards at", par.id);
});
render();
</script>
</body>
